name: Build and Release Standalone Executable

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Run Repository Health & Verification Checks
      run: powershell -ExecutionPolicy Bypass -File check.ps1

    - name: Publish Application via build_exe.ps1
      run: powershell -ExecutionPolicy Bypass -File build_exe.ps1

    - name: Create Release Zip Package
      run: |
        Compress-Archive -Path dist/* -DestinationPath SM2Customizer-win-x64.zip

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SM2Customizer-win-x64
        path: SM2Customizer-win-x64.zip

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          SM2Customizer-win-x64.zip
          dist/SM2Customizer.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
